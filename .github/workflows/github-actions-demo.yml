name: GitHub Actions Demo
on:
  workflow_dispatch:
  schedule:
    - cron: '* * * * *'
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest test_adition.py